name: publish-worker

# Builds/pushes the M3 Peloton WORKER image (ghcr.io/thaynes43/ytdrivarr-peloton-worker),
# separate from the TS core's publish.yml. Mirrors publish.yml/ci.yml conventions.
#   * push to main touching worker/**  -> push `latest` + `sha-<sha>`
#   * workflow_dispatch (any branch)   -> push `sha-<sha>` (for a live branch dry-run)
#   * pull_request touching worker/**  -> pytest + ruff + a push:false Docker smoke build
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/publish-worker.yml']
  pull_request:
    paths: ['worker/**', '.github/workflows/publish-worker.yml']
  workflow_dispatch:

concurrency:
  group: publish-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: install (worker + dev extras)
        working-directory: worker
        run: pip install -e '.[dev]'
      - name: ruff
        working-directory: worker
        run: ruff check src tests
      - name: pytest
        working-directory: worker
        run: pytest -q

  docker-smoke:
    # PR smoke build only (the real push happens on main / dispatch).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: false
          platforms: linux/amd64
          tags: ytdrivarr-peloton-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/thaynes43/ytdrivarr-peloton-worker
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
