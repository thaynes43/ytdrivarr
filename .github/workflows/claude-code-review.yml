name: Claude Code Review

# Advisory automated review. NOT a required check; never add it to branch rules.
# Needs the Claude GitHub App on the repo and the CLAUDE_CODE_OAUTH_TOKEN repo
# secret. Without the secret the job still finishes green (review step skipped).
# Plain `pull_request` only: fork PRs get no secrets and skip cleanly.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

# Re-review on every push, but only the newest push per PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-advisory-review:
    name: Claude advisory review
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
      && github.actor != 'renovate[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # post the review + inline comments
      id-token: write # OIDC exchange for the Claude GitHub App token
      actions: read # read CI results for the PR

    steps:
      - name: Check for Claude token
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping the Claude review."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        if: steps.gate.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'haynes-dev-bot'
          track_progress: true
          use_sticky_comment: true
          # Pinned full model id, never an alias.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
          additional_permissions: |
            actions: read
          prompt: |
            You are the automated reviewer for ytdrivarr, an *arr-shaped ytdl-sub
            content service (TypeScript core on Hono + drizzle + Postgres, plus a
            Python Peloton scraper worker under `worker/`). The PR branch is already
            checked out. Review PR #${{ github.event.pull_request.number }} of
            ${{ github.repository }}.

            ## Step 1: context
            - `gh pr diff ${{ github.event.pull_request.number }}` for the changes
            - `gh pr view ${{ github.event.pull_request.number }}` for intent
            - Read `README.md` (architecture, C1-C8 provider contract, config table)
              and the code around each changed file. Do not repeat feedback already
              present on the PR.

            ## Step 2: what this repo cares about
            Layout: `src/contracts/` (C1-C8 interfaces), `src/core/` (dispatcher,
            emitter, dedup, projection, jobs, health, metrics), `src/providers/`
            (youtube, in-core-url-list, peloton), `src/api/` (Hono routes, zod
            schemas, OpenAPI), `src/db/` + `migrations/` (drizzle), `src/console/`
            (vanilla-TS operator SPA), `worker/` (Python Selenium worker).

            **CRITICAL: block the merge**
            - Secrets and PII: a bearer, cookie, Peloton credential or API key
              committed, logged, returned by an API route, shown in the console or
              emitted as a metric label/value. The auth settings surface shows key
              COUNT only, never values; `/metrics` and `/health` are open and must
              carry no secrets. Tests use obvious placeholders.
            - Auth regressions: an `/api/v1` route reachable without `X-Api-Key` in
              `api-key` mode, empty key lists no longer deny-by-default, or the
              `open` mode semantics changed.
            - Data loss or corruption: a non-atomic projection write (it must be
              write-temp-then-rename), a change that lets the season/episode guard
              renumber existing entries, dedup bypass, or a migration that drops or
              rewrites data without a safe path. Migrations must come from
              `pnpm db:generate`, not hand edits.
            - Logic errors: races, unhandled null, off-by-one, timers or jobs
              registered but never cancelled or reclaimed.
            - Breaking changes: a changed contract, schema or response shape whose
              callers (console, worker, OpenAPI, tests) were not updated.

            **HIGH: should fix**
            - Provider boundary violations: a provider invoking a capability it did
              not declare (negated capabilities must never be invoked), provider
              logic leaking into `src/core/`, or vendoring yt-dlp instead of
              rendering ytdl-sub config.
            - A scheduler tick not scoped to its own provider's sources.
            - Request or response bodies not validated with zod, or the OpenAPI
              document no longer generated from the schemas.
            - Core and worker protocol drift: the job claim/heartbeat/report/fail
              contract or an alarm kind changed on one side only (they ship together).
            - Swallowed errors or failure paths with no logging or health signal
              (a run must not report "0 added" over a hidden failure).
            - Changed behavior with no test change, or a skipped/weakened test.
            - Workflow changes that widen permissions, use `pull_request_target`,
              or interpolate untrusted event data into `run:` scripts.
            - README out of date: a new env var missing from the Configuration
              table, a new route missing from the API summary, a new metric missing
              from the Observability table.

            **MEDIUM: consider**
            - Console SPA drifting from being a strict view over the REST API, or a
              layout break at the 390px phone width.
            - Conventional-commit PR title (feat/fix/perf/refactor/docs/chore): the
              squash title feeds release-please versioning and the changelog.
            - Unchecked access on external data (Peloton, yt-dlp output); missing
              type coercion.

            **Ignore entirely:** formatting (prettier and eslint already run in CI),
            naming, import order, missing docstrings on unchanged code, and feature
            suggestions beyond the PR's intent.

            ## Step 3: report
            - Post each line-specific finding with
              `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`),
              prefixing the body with its severity: `CRITICAL:`, `HIGH:` or `MEDIUM:`.
            - Then post ONE summary comment with `gh pr comment` containing a verdict
              (`Looks good` / `Needs changes` / `Has critical issues`) and the findings
              grouped by severity, each naming the file and line. Be concise: no
              praise, no restating the diff.
            - If the diff is clean, say exactly "No findings." followed by one sentence
              on what you checked. Never invent a finding to look thorough.
            - Only review files changed in this PR. Post GitHub comments only; do not
              return the review as chat text.
